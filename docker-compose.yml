services:
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  kafka:
    # Official Apache Software Foundation image (no login/subscription needed,
    # actively released) — replaces bitnamilegacy/kafka after Docker Hub
    # deprecated the public bitnami/kafka namespace. KRaft config below is a
    # near 1:1 rename of Bitnami's KAFKA_CFG_* vars to Apache's KAFKA_* vars.
    image: apache/kafka:3.9.2
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # Stock Apache Kafka defaults this to 3; with one broker that starves
      # __consumer_offsets of replicas and the group coordinator never comes
      # up (bitnamilegacy defaulted this to 1 internally for single-node use).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    ports: ['9200:9200']
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 5s
      retries: 30
